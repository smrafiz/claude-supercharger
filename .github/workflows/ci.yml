name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Run tests
        run: bash tests/run.sh

  # v2.9.3: verify the cross-platform hardening (G1 notify, G2 md5, G3 flock)
  # actually works on real Windows Git Bash — GitHub's `shell: bash` on
  # windows-latest IS Git Bash (bundled MSYS2), the runtime Claude Code routes to.
  # Scoped to the Phase 1 fallback suites (they need no Claude Code session); the
  # .gitattributes LF rule (G5) is exercised implicitly — a CRLF .sh wouldn't run.
  test-windows:
    name: Test suite (Windows / Git Bash)
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Verify prerequisites on PATH
        run: |
          command -v jq >/dev/null 2>&1 || choco install jq -y
          echo "bash:    $(bash --version | head -1)"
          echo "jq:      $(jq --version)"
          echo "python3: $(python3 --version 2>&1 || python --version)"

      # Split per-suite with a hard timeout so a hang fails fast and the step
      # view pinpoints the culprit (rather than one opaque multi-suite step).
      - name: notify-helper (G1 Windows toast branch)
        run: timeout 180 bash tests/test-notify-helper.sh

      - name: md5 fallback (G2 python tier)
        run: timeout 180 bash tests/test-md5-fallback.sh

      - name: tool-history-tracker (G3 flock-absent trim)
        run: timeout 180 bash tests/test-tool-history-tracker.sh

  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check version strings match
        run: |
          LIB=$(grep -m1 '^VERSION=' lib/utils.sh | tr -d '"' | cut -d= -f2)
          TOOL=$(grep -m1 '^VERSION=' tools/supercharger.sh | tr -d '"' | cut -d= -f2)
          README=$(grep -oE 'version-[0-9]+\.[0-9]+\.[0-9]+' README.md | head -1 | sed 's/^version-//')
          echo "lib/utils.sh:          $LIB"
          echo "tools/supercharger.sh: $TOOL"
          echo "README.md:             $README"
          if [ "$LIB" != "$TOOL" ] || [ "$LIB" != "$README" ]; then
            echo "ERROR: Version mismatch — all three must match."
            exit 1
          fi
          echo "OK: all versions are $LIB"

  shellcheck:
    name: Shellcheck
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck
        run: |
          if command -v apt-get &>/dev/null; then
            sudo apt-get install -y shellcheck
          elif command -v brew &>/dev/null; then
            brew install shellcheck
          fi

      - name: Check hooks, lib, tools, and tests for errors
        run: |
          find hooks/ lib/ tools/ tests/ -name '*.sh' -print0 | xargs -0 shellcheck --severity=error
