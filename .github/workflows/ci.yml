name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Run tests
        run: bash tests/run.sh

  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Single source of truth for the parity rules: tests/test-version-parity.sh.
      # It also runs inside the full suite; this job just surfaces it as a fast,
      # independently-named signal without waiting on all 2374 tests.
      - name: Check version strings match
        run: bash tests/test-version-parity.sh

  plugin-manifest:
    name: Plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Manifests are valid JSON
        run: |
          python3 -c "import json; json.load(open('.claude-plugin/plugin.json'))"
          python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))"

      - name: Generated plugin artifacts are in lockstep with source
        run: |
          bash tools/gen-plugin-hooks.sh --check
          bash tools/gen-plugin-commands.sh --check

  perf:
    name: Hook latency (report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Report-only on purpose (HOOK-LATENCY-PLAN §6): runner variance is larger
      # than the regressions worth catching, so an absolute ms ceiling would cry
      # wolf and get muted — worse than no gate. Make the number visible first;
      # gate once there is enough history to know the noise floor.
      #
      # The measurement itself is NOT optional. `set -o pipefail` plus the report
      # script's own input validation mean a run that produces no numbers fails the
      # job rather than passing quietly, which is the failure mode this repo keeps
      # finding: an instrument reporting "fine" because it never ran.
      - name: Measure hook chain and statusline
        run: |
          set -euo pipefail
          bash tests/perf-chain.sh --iterations 5 --json > /tmp/perf-chain.json
          bash tests/perf-chain.sh --target statusline --iterations 10 --json > /tmp/perf-statusline.json

      - name: Report against committed baseline
        run: |
          bash tools/perf-report.sh \
            --chain /tmp/perf-chain.json \
            --statusline /tmp/perf-statusline.json

      # Every registered event, ranked by the cost a user waits behind. The chain
      # and statusline targets above cover two hot paths; this covers the ones
      # nobody thought to name — which is how a 27.7ms per-message hook survived
      # four releases (2.26.8 -> 2.26.12).
      - name: Hook cost by event (all events)
        run: |
          set -euo pipefail
          bash tests/perf-chain.sh --target all --iterations 3 | tee -a "$GITHUB_STEP_SUMMARY"

  windows-smoke:
    name: Windows (Git Bash)
    runs-on: windows-latest
    # Git Bash is the interpreter Claude Code auto-selects on Windows, so this is
    # the real target — not a POSIX approximation.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # WINDOWS-SUPPORT-PLAN §6 called this job "the linchpin — turns 'probably
      # works' into 'verified' and prevents regression". Phase 1 (G1/G2/G3/G5)
      # shipped entirely from macOS, so until now nothing had ever RUN on Windows.
      #
      # Deliberately a SUBSET, not the full 3290-test suite. The suite assumes
      # POSIX tooling throughout; running all of it here would produce a wall of
      # environment noise that nobody reads. These files are the ones whose whole
      # purpose is cross-platform behaviour.
      - name: Environment report
        run: |
          echo "bash: $BASH_VERSION"
          echo "uname: $(uname -s 2>/dev/null || echo unknown)"
          echo "OSTYPE: $OSTYPE"
          for t in jq python3 python md5sum md5 openssl flock powershell.exe pwsh git; do
            if command -v "$t" >/dev/null 2>&1; then
              echo "  present: $t -> $(command -v "$t")"
            else
              echo "  ABSENT : $t"
            fi
          done

      - name: Install jq if the runner lacks it
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            choco install jq -y --no-progress || echo "choco install failed; jq-dependent tests will show it"
          fi

      # A hook must actually execute under Git Bash — the single fact Phase 1
      # never got to demonstrate.
      - name: A hook runs under Git Bash
        run: |
          # set +e for the same reason as the smoke step below: the runner starts
          # this shell with -e, and capturing rc=$? from a hook that may exit
          # non-zero would abort the step instead of reporting the code.
          set +e
          printf '{"tool_name":"Bash","tool_input":{"command":"echo hi"},"cwd":"."}' \
            | bash hooks/safety.sh >/dev/null 2>&1
          rc=$?
          set -u
          echo "benign command -> rc=$rc (0 = allowed)"
          [ "$rc" = "0" ] || { echo "a benign command was not allowed"; exit 1; }

      # G6 — the plan has always said symlink reliability on Git Bash is
      # "unclear; validate, worst case degrade safely". enforce-pkg-manager.sh
      # uses `[ -f X ] && [ ! -L X ]` in four places, meaning "a REAL lockfile,
      # not a symlink". The failure directions are not symmetric:
      #   -L always false  -> guard fires more often  -> fail-safe
      #   -L always true   -> guard silently SKIPPED  -> the dangerous one
      # So the assertion that matters is that a real file is seen as real.
      - name: G6 — symlink detection semantics
        run: |
          set +e
          d=$(mktemp -d)
          printf 'lock\n' > "$d/real.lock"
          ln -s "$d/real.lock" "$d/link.lock" 2>/dev/null
          ln_rc=$?
          set -u
          echo "ln -s exit: $ln_rc (non-zero = symlinks unavailable, which is fine)"
          [ -f "$d/real.lock" ] && echo "  real: -f yes" || echo "  real: -f NO"
          [ -L "$d/real.lock" ] && echo "  real: -L yes (WRONG)" || echo "  real: -L no (correct)"
          if [ -e "$d/link.lock" ]; then
            [ -L "$d/link.lock" ] && echo "  link: -L yes (symlinks work)" || echo "  link: -L no (copied, not linked)"
          else
            echo "  link: not created — symlinks unavailable on this runner"
          fi
          # The load-bearing assertion: a real lockfile must trip the guard.
          if [ -f "$d/real.lock" ] && [ ! -L "$d/real.lock" ]; then
            echo "  guard condition on a real lockfile: TRUE (fires — correct)"
          else
            echo "  guard condition on a real lockfile: FALSE — enforce-pkg-manager would be SKIPPED on Windows"
            exit 1
          fi

      # DIRECT assertions, not the POSIX test files. Those build fake PATHs with
      # `ln -sf` to force a specific tier; symlink creation is unreliable on
      # Windows without developer mode, so running them here would report harness
      # failures dressed as product failures. What matters on this runner is the
      # real-world outcome, which needs no PATH surgery.
      - name: G2 — sc_md5 produces a correct digest on Git Bash
        run: |
          set -euo pipefail
          . hooks/lib-hash.sh
          got=$(printf '%s' "/some/project" | sc_md5)
          want="f1fb6800292c5ea988d9e3d91a2676ff"
          echo "digest: [$got]"
          [ "$got" = "$want" ] || { echo "expected $want — an EMPTY value means every project shares one state key"; exit 1; }

      - name: G1 — the Windows host is detected
        run: |
          set -euo pipefail
          . hooks/notify-helper.sh
          host=$(_win_host)
          echo "_win_host: [$host]"
          [ -n "$host" ] || { echo "no Windows host detected — notifications fall through to the bell"; exit 1; }

      - name: G3 — history trim works without flock
        run: |
          set -euo pipefail
          command -v flock >/dev/null 2>&1 && echo "note: flock present" || echo "note: flock absent (expected)"
          d=$(mktemp -d); h="$d/hist"; seq 1 50 > "$h"
          tail -n 20 "$h" > "$h.tmp" && mv "$h.tmp" "$h"
          n=$(wc -l < "$h" | tr -d ' ')
          echo "lines after trim: $n"
          [ "$n" = "20" ] || exit 1

      - name: Hook chain smoke — a destructive command is still blocked
        run: |
          # `set +e` is REQUIRED, not tidying. The runner starts this shell as
          # `bash --noprofile --norc -e -o pipefail`, and a `set -uo pipefail`
          # line does not undo the -e it was launched with. A blocking guard
          # exits 2 BY DESIGN, so errexit aborted the step on the guard working
          # correctly and reported it as "the core guard did not block".
          set +e
          printf '{"tool_name":"Bash","tool_input":{"command":"rm -rf /"},"cwd":"."}' \
            | bash hooks/safety.sh >/dev/null 2>&1
          rc=$?
          set -u
          echo "rm -rf / -> rc=$rc (2 = blocked)"
          [ "$rc" = "2" ] || { echo "the core guard did not block on Windows"; exit 1; }

      # G4 — the last Windows gap. Two claims from a scoping pass that CANNOT be
      # settled from macOS, so they are asked here instead of guessed at.
      - name: G4a — does stamp_hook_shebangs mangle hooks on Git Bash?
        run: |
          set +e
          echo "command -v bash -> $(command -v bash)"
          # Run it against a COPY. If it rewrites shebangs, the question is
          # whether a rewritten hook still executes — that is the harm, not the edit.
          d=$(mktemp -d); cp hooks/*.sh "$d/" 2>/dev/null
          before=$(head -1 "$d/safety.sh")
          ( . lib/hooks.sh 2>/dev/null; stamp_hook_shebangs "$d" ) >/dev/null 2>&1
          after=$(head -1 "$d/safety.sh")
          echo "shebang before: $before"
          echo "shebang after : $after"
          if [ "$before" = "$after" ]; then
            echo "  -> no rewrite on this platform"
          else
            echo "  -> REWRITTEN; checking the stamped hook still runs"
            printf '{"tool_name":"Bash","tool_input":{"command":"echo hi"},"cwd":"."}' | "$d/safety.sh" >/dev/null 2>&1
            rc=$?
            echo "  stamped hook direct-exec rc=$rc"
            [ "$rc" = "0" ] || { echo "  STAMPED HOOK NO LONGER EXECUTES — install would break every guard"; exit 1; }
          fi

      - name: G4b — statusLine.command must be POSIX after a real merge
        run: |
          set -euo pipefail
          # The first version of this step asserted what PYTHON produces
          # (expanduser+join). That is a fact about Windows python, not about our
          # code — it stays true after the fix, so the step failed for the wrong
          # reason once v2.26.57 landed. Assert the OUTCOME instead: run the real
          # merge and read what actually reaches settings.json.
          echo "for reference, python still yields: $(python3 -c "import os; print(os.path.join(os.path.expanduser('~'), '.claude', 'x'))")"
          T=$(mktemp -d)
          mkdir -p "$T/.claude/supercharger/hooks"
          printf '#!/usr/bin/env bash\necho x\n' > "$T/.claude/supercharger/hooks/statusline.sh"
          chmod +x "$T/.claude/supercharger/hooks/statusline.sh"
          ( export HOME="$T"; . lib/hooks.sh; merge_hooks_into_settings full true ) >/dev/null 2>&1 || true
          cmd=$(jq -r '.statusLine.command // ""' "$T/.claude/settings.json" 2>/dev/null || echo "")
          echo "statusLine.command: ${cmd:-<absent>}"
          case "$cmd" in
            "")    echo "  statusLine missing — the merge did not write it on Git Bash"; exit 1 ;;
            *\\*)  echo "  BACKSLASH PRESENT — Git Bash cannot execute this"; exit 1 ;;
            *)     echo "  POSIX path — correct" ;;
          esac

      # G5, verified where it actually matters. Git for Windows defaults to
      # core.autocrlf=true; if .gitattributes is not doing its job, the shebang
      # becomes `/usr/bin/env bash\r` and every hook dies at once. Assert on the
      # CHECKED-OUT bytes rather than on the policy file.
      # v2.26.52 shipped .gitattributes believing it pinned LF; this job's first
      # run proved otherwise (core.autocrlf=true, every .sh checked out CRLF).
      # The cause could not be reproduced from macOS, so ask git directly.
      # `ls-files --eol` is the decisive one: it reports the INDEX ending, the
      # WORKTREE ending, and the attribute git actually applied — which separates
      # "the attribute was ignored" from "the blob itself holds CRLF".
      - name: Diagnose line-ending handling
        run: |
          echo "git: $(git --version)"
          echo "--- crlf-related config, all scopes ---"
          git config -l --show-origin 2>/dev/null | grep -iE 'autocrlf|eol|safecrlf' || echo "  (none)"
          echo "--- .gitattributes in the checkout ---"
          ls -l .gitattributes 2>/dev/null || echo "  ABSENT"
          echo "  first bytes: $(head -c 40 .gitattributes 2>/dev/null | od -An -c | head -2 | tr -s ' ')"
          echo "--- what git says the attributes are, ON THIS RUNNER ---"
          git check-attr text eol -- hooks/safety.sh .gitattributes 2>&1 || true
          echo "--- index vs worktree endings (the decisive check) ---"
          git ls-files --eol hooks/safety.sh .gitattributes tests/run.sh 2>&1 || true
          echo "--- raw first line of a checked-out hook ---"
          head -c 60 hooks/safety.sh | od -An -c | head -3

      - name: Checked-out shell scripts are LF, not CRLF
        run: |
          set -euo pipefail
          echo "core.autocrlf: $(git config --get core.autocrlf || echo '<unset>')"
          # Ask GIT, not grep. The first version used
          #   git ls-files -z '*.sh' | xargs -0 grep -lU $'\r'
          # which reported EVERY .sh as CRLF on this runner while `ls-files --eol`
          # and `od -c` both showed LF — a false positive that made a working
          # .gitattributes look broken and got G5 recorded as "not fixed".
          # `ls-files --eol` is authoritative: git reports the worktree ending it
          # actually produced, with no shell-quoting or MSYS grep semantics in the
          # way.
          # `w/none` is an EMPTY file — no line endings to get wrong. Excluding it
          # is not a loosening: an assertion that flags empty files is the same
          # kind of false positive as the grep this replaced.
          bad=$(git ls-files --eol -- '*.sh' '*.py' \
                | awk '$2 != "w/lf" && $2 != "w/none" { print $2 "  " $NF }')
          if [ -n "$bad" ]; then
            echo "Non-LF worktree endings (.gitattributes is not holding):"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "All tracked *.sh and *.py checked out with LF."

          # The policy file itself must be LF too — it was w/crlf with attr/
          # unspecified, because no rule covered dotfiles.
          ga=$(git ls-files --eol -- .gitattributes | awk '{print $2}')
          echo ".gitattributes worktree ending: $ga"
          [ "$ga" = "w/lf" ] || { echo ".gitattributes is not itself pinned to LF"; exit 1; }

      # Every step above exercises hooks from the CHECKOUT. This is the only one
      # that exercises what a real user touches FIRST, and until now install.sh had
      # never run on Windows at all — not here, not by a human. Its Windows arm
      # (v2.26.58: platform detection moved above the dependency gates, plus the
      # winget/choco jq branch) had therefore never executed on the platform it was
      # written for. `test-install.sh` covers the installer, but the suite it lives
      # in runs only on ubuntu and macos.
      #
      # Asserts OUR behaviour, not the environment's: that the installer exits 0,
      # that it produced the files it claims to, that settings.json carries hook
      # registrations, and that a hook INSTALLED BY IT still blocks. G4b was a step
      # asserting a fact about Python rather than about our code, and stayed red
      # after the code was fixed — this avoids that shape.
      - name: install.sh runs non-interactively and the installed hook fires
        run: |
          # The runner starts steps with -e; capturing rc from a hook that exits
          # non-zero would abort the step instead of reporting the code.
          set +e
          WORK=$(mktemp -d)
          export HOME="$WORK/home"
          mkdir -p "$HOME"
          LOG="$WORK/install.log"

          bash install.sh --mode full --roles developer \
            --config deploy --settings deploy --economy lean >"$LOG" 2>&1
          rc=$?
          echo "installer rc=$rc"
          if [ "$rc" -ne 0 ]; then
            echo "--- installer output ---"; cat "$LOG"; exit 1
          fi

          for f in .claude/CLAUDE.md .claude/settings.json \
                   .claude/supercharger/hooks/safety.sh; do
            if [ ! -f "$HOME/$f" ]; then
              echo "MISSING after install: $f"
              echo "--- installer output ---"; cat "$LOG"; exit 1
            fi
            echo "  present: $f"
          done

          if ! jq -e '.hooks | length > 0' "$HOME/.claude/settings.json" >/dev/null; then
            echo "settings.json has no hook registrations"
            jq . "$HOME/.claude/settings.json" 2>&1 | head -30
            exit 1
          fi
          echo "settings.json parses and carries hook registrations"

          # The decisive assertion: a hook placed by install.sh — not the checkout
          # copy every other step uses — still denies on Git Bash.
          printf '{"tool_name":"Bash","tool_input":{"command":"rm -rf /"},"cwd":"%s"}' "$WORK" \
            | bash "$HOME/.claude/supercharger/hooks/safety.sh" >/dev/null 2>&1
          hrc=$?
          echo "installed safety.sh rc=$hrc (expect 2)"
          [ "$hrc" -eq 2 ] || { echo "the INSTALLED hook did not block a destructive command"; exit 1; }

      # The updater had never run on Windows either, which is why a user asking
      # "should I use /sc-update on Windows?" had to be told no, use git pull and
      # install.sh instead — the installer is verified here, the updater was not.
      # update.sh also has form for reporting success while deploying nothing (see
      # the note at tools/update.sh:295), and a silent no-op on an unverified
      # platform is the worst outcome: the user believes they have a fix they do
      # not have. So this asserts BEHAVIOUR, not the exit code.
      - name: update.sh runs on Git Bash and actually deploys
        run: |
          set +e
          WORK=$(mktemp -d)
          export HOME="$WORK/home"
          mkdir -p "$HOME"

          # Seed an install, then age its version marker so the updater has
          # something real to do rather than short-circuiting on "up to date".
          bash install.sh --mode full --roles developer \
            --config deploy --settings deploy --economy lean >"$WORK/install.log" 2>&1
          [ $? -eq 0 ] || { echo "seed install failed"; cat "$WORK/install.log"; exit 1; }
          echo "0.0.1" > "$HOME/.claude/supercharger/.version"

          # Run the INSTALLED copy, not tools/update.sh from the checkout. That is
          # what /sc-update invokes, and it is the branch that clones to a temp dir.
          # Run from the checkout instead, update.sh does `git pull --rebase` on the
          # checkout itself — which fails on CI's detached HEAD and on any working
          # tree with local edits. Caught in a local dry-run before it could redden
          # this job for a reason no user would ever hit.
          UPD="$HOME/.claude/supercharger/tools/update.sh"
          [ -f "$UPD" ] || { echo "installer did not deploy update.sh"; exit 1; }

          # --check is read-only. A network failure on a CI runner is not a product
          # bug, so an unreachable GitHub is tolerated — but a crash is not.
          bash "$UPD" --check >"$WORK/check.log" 2>&1
          crc=$?
          echo "--check rc=$crc"; cat "$WORK/check.log"
          if [ "$crc" -ne 0 ]; then echo "update.sh --check crashed on Git Bash"; exit 1; fi

          if grep -qi 'could not reach github' "$WORK/check.log"; then
            echo "NOTE: GitHub unreachable from this runner — skipping the deploy half."
            exit 0
          fi

          bash "$UPD" --yes >"$WORK/update.log" 2>&1
          urc=$?
          echo "--yes rc=$urc"
          if [ "$urc" -ne 0 ]; then
            echo "--- update output ---"; cat "$WORK/update.log"; exit 1
          fi

          # BEHAVIOUR, not the marker: the version file is what update.sh writes
          # itself, so trusting it would re-create the bug it once had.
          n=$(ls "$HOME/.claude/supercharger/hooks/"*.sh 2>/dev/null | wc -l | tr -d ' ')
          echo "hooks present after update: $n"
          [ "${n:-0}" -gt 100 ] || { echo "update deployed nothing"; cat "$WORK/update.log"; exit 1; }

          printf '{"tool_name":"Bash","tool_input":{"command":"rm -rf /"},"cwd":"%s"}' "$WORK" \
            | bash "$HOME/.claude/supercharger/hooks/safety.sh" >/dev/null 2>&1
          hrc=$?
          echo "post-update safety.sh rc=$hrc (expect 2)"
          [ "$hrc" -eq 2 ] || { echo "hooks stopped guarding after an update"; exit 1; }

      # v2.26.83 RECON, TEMPORARY: the plan's Phase 2 item 4 called for the suite
      # to run here and it never landed, so 3540 assertions run on ubuntu+macOS
      # and ZERO on Windows. This step exists to LEARN which files are actually
      # Windows-safe rather than guess: several build a PATH with `ln -sf`, and
      # Git Bash's `ln -s` silently COPIES (plan §11.1), which would report
      # harness breakage as product failure.
      # continue-on-error so the recon run cannot turn master red. Once the
      # failure list is triaged this becomes a curated TEST_GLOB subset, gating.
      # The recon showed path-guard REFUSING NOTHING on Windows ("$HOME accepted
      # as a root: rc=0") — i.e. the whole home directory becomes in-project and
      # writable. The suspected cause is a FORM mismatch, not a logic error: Git
      # Bash hands paths as /c/Users/..., while Windows python's expanduser('~')
      # returns C:\Users\..., and realpath cannot reconcile the two — so
      # `rp == home` is False and the refusal is skipped.
      # This step PROVES or DISPROVES that before a security hook is patched on a
      # hypothesis. Nothing Windows is answerable from macOS.
      - name: DIAGNOSTIC — POSIX vs Windows path forms
        continue-on-error: true
        shell: bash
        run: |
          echo "bash   HOME       = $HOME"
          echo "bash   PWD        = $PWD"
          python3 - <<'PY'
          import os
          hb = os.environ.get('HOME','')
          exp = os.path.expanduser('~')
          print('python expanduser  =', exp)
          print('python realpath(HOME env) =', os.path.realpath(hb) if hb else '(no HOME)')
          print('python os.sep      =', repr(os.sep))
          print('MATCH realpath(expanduser) == realpath(HOME env)?',
                os.path.realpath(exp) == os.path.realpath(hb) if hb else 'n/a')
          # The exact comparison path-guard makes for a POSIX-form candidate root.
          cand = hb
          rp = os.path.realpath(cand)
          home = os.path.realpath(exp)
          print('candidate realpath =', rp)
          print('home realpath      =', home)
          print('REFUSAL WOULD FIRE (rp == home)?', rp == home)
          print('ancestor form: home.startswith(rp + sep)?', home.startswith(rp + os.sep))
          PY

      # The suite recon reports test-additional-roots refusals failing on Windows:
      # additionalRoots:["/"] and ["$HOME"] are ACCEPTED, which disables the guard.
      # Inspection could not settle why, and one hypothesis (expanduser != $HOME)
      # was disproven by the path-form diagnostic above — realpath(HOME env) ==
      # realpath(expanduser) on this runner, so the comparison itself is sound.
      # Only the platform can say where it actually diverges. This runs the exact
      # failing scenario and prints every intermediate the refusal depends on.
      - name: DIAGNOSTIC — why path-guard root refusals do not fire
        continue-on-error: true
        shell: bash
        run: |
          set +e
          CFG=".supercharger"".json"
          W=$(mktemp -d)/w; mkdir -p "$W/free"; : > "$W/free/f.php"
          echo "layout = $W"

          printf '{"additionalRoots":["/"]}' > "$W/free/$CFG"
          echo "--- root '/' , write to /etc/hosts (expect rc=2, root refused) ---"
          printf '{"tool_name":"Write","tool_input":{"file_path":"/etc/hosts","content":"x"},"cwd":"%s"}' "$W/free" \
            | bash hooks/path-guard.sh; echo "  rc=$?"

          printf '{"additionalRoots":["%s"]}' "$HOME" > "$W/free/$CFG"
          echo "--- root \$HOME , write into \$HOME (expect rc=2, root refused) ---"
          printf '{"tool_name":"Write","tool_input":{"file_path":"%s/.ssh/authorized_keys","content":"x"},"cwd":"%s"}' "$HOME" "$W/free" \
            | bash hooks/path-guard.sh; echo "  rc=$?"

          # The containment logic is provably correct under Windows path semantics
          # (checked locally against ntpath with the runner's own measured values):
          # the symlink section AND the /etc/ string match should each block. They
          # do not, so the sections must be SKIPPED — both are gated on `proj`, and
          # both `proj` and `p` come from jq. This shows what the hook actually
          # extracts, which is the one thing not yet observed.
          echo "--- what the hook extracts from the payload ---"
          PAY=$(printf '{"tool_name":"Write","tool_input":{"file_path":"/etc/hosts","content":"x"},"cwd":"%s"}' "$W/free")
          echo "  jq present : $(command -v jq || echo NO)"
          echo "  file_path  = [$(printf '%s' "$PAY" | jq -r '.tool_input.file_path // empty' 2>&1)]"
          echo "  cwd        = [$(printf '%s' "$PAY" | jq -r '.cwd // .workspace.current_dir // empty' 2>&1)]"
          echo "  tool_name  = [$(printf '%s' "$PAY" | jq -r '.tool_name // empty' 2>&1)]"
          echo "  disabled   = [$(printf '%s' "$PAY" | jq -r '.disabled // empty' 2>&1)]"

          # The runner blocks a drive-letter path and allows a POSIX-form one. Both
          # gated sections (symlink, abs-path) start from os.path.isabs(p), and on
          # Windows a single leading slash is drive-RELATIVE, not absolute. If isabs
          # is False for '/etc/hosts' then both sections are skipped and the guard
          # allows it — which matches every observation. Settle it here; it cannot
          # be checked from macOS, where posixpath answers instead.
          # THE decisive probe. Five earlier probes each answered one INPUT to the
          # guard and none identified why a POSIX-form path is allowed here while a
          # drive-letter one is blocked. This traces the REAL code through its gates
          # — not a copy that can drift — and prints which section it reaches and
          # what it decides. Inert unless SC_PATHGUARD_DEBUG is set; stderr only.
          echo "--- TRACE: the guard's own gates, POSIX-form path ---"
          printf '{"additionalRoots":["/"]}' > "$W/free/$CFG"
          printf '{"tool_name":"Write","tool_input":{"file_path":"/etc/hosts","content":"x"},"cwd":"%s"}' "$W/free" \
            | SC_PATHGUARD_DEBUG=1 bash hooks/path-guard.sh 2>&1 >/dev/null | sed 's/^/    /'
          echo "--- TRACE: the same guard, drive-letter path (this one blocks) ---"
          printf '{"tool_name":"Write","tool_input":{"file_path":"C:/Windows/System32/drivers/etc/hosts","content":"x"},"cwd":"%s"}' "$W/free" \
            | SC_PATHGUARD_DEBUG=1 bash hooks/path-guard.sh 2>&1 >/dev/null | sed 's/^/    /'

          echo "--- isabs, the gate both blocking sections start from ---"
          python3 - <<'PYEOF'
          import os, sys, ntpath
          print('  python        =', sys.version.split()[0])
          for cand in ('/etc/hosts', 'C:/Users/x/f', '/c/Users/x/f', '\\\\etc\\\\hosts'):
              print(f'    isabs({cand!r:22}) = {os.path.isabs(cand)}   ntpath={ntpath.isabs(cand)}')
          PYEOF

          echo "--- what the refusal comparisons actually see ---"
          SC_PROJ="$W/free" python3 - <<'PYEOF'
          import os
          proj = os.path.realpath(os.environ['SC_PROJ'])
          home = os.path.realpath(os.path.expanduser('~'))
          print(f'  proj_real = {proj!r}')
          print(f'  home      = {home!r}')
          print(f'  os.sep    = {os.sep!r}')
          for cand in ('/', os.environ.get('HOME', ''), '/etc/hosts'):
              if not cand:
                  continue
              rp = os.path.realpath(cand)
              print(f'  cand={cand!r}')
              print(f'    realpath    = {rp!r}  isabs={os.path.isabs(cand)}  isdir={os.path.isdir(rp)}')
              print(f'    fs-root?      {rp == os.path.dirname(rp)}   (dirname={os.path.dirname(rp)!r})')
              print(f'    ==home?       {rp == home}   ancestor-of-home? {home.startswith(rp + os.sep)}')
          PYEOF
          rm -rf "$(dirname "$W")"

      - name: RECON — full suite on Git Bash (report-only)
        continue-on-error: true
        shell: bash
        run: |
          # v2.26.83: workspace-relative, NOT /tmp. A POSIX /tmp path is invisible
          # to Windows python and to the Node artifact action — MSYS rewrites paths
          # passed as ARGUMENTS, not strings inside a script. The first run proved
          # it: grep read the file, python raised FileNotFoundError on the same path
          # and upload-artifact found nothing. Same class as the product bugs this
          # job exists to find.
          TEST_JOBS=4 bash tests/run.sh > win-suite.log 2>&1 || true
          echo "=== totals ==="
          grep -E '^Total:' win-suite.log | tail -1
          # Group with python, not awk: the awk form printed NOTHING on Git Bash
          # (the FAIL lines carry ANSI colour), and grouping is the whole point of
          # the recon. Strip escapes first, then attribute each FAIL to its file.
          python3 - <<'PY'
          import re
          cur='?'; fails={}; tot={}
          for line in open('win-suite.log', encoding='utf-8', errors='replace'):
              s=re.sub(r'\x1b\[[0-9;]*m','',line).rstrip()
              m=re.match(r'^--- (\S+) ---', s)
              if m: cur=m.group(1); continue
              t=s.strip()
              if t.startswith(('FAIL','PASS')): tot[cur]=tot.get(cur,0)+1
              if t.startswith('FAIL'): fails[cur]=fails.get(cur,0)+1
          print(f"files with failures: {len(fails)} | total failures: {sum(fails.values())}")
          for f,c in sorted(fails.items(), key=lambda x:-x[1]):
              print(f"  {c:4d}/{tot.get(f,0):<4d}  {f}")
          PY

      - name: RECON — upload the full suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-suite-log
          path: win-suite.log
          retention-days: 7

  shellcheck:
    name: Shellcheck
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck
        run: |
          if command -v apt-get &>/dev/null; then
            sudo apt-get install -y shellcheck
          elif command -v brew &>/dev/null; then
            brew install shellcheck
          fi

      - name: Check hooks, lib, tools, and tests for errors
        run: |
          find hooks/ lib/ tools/ tests/ -name '*.sh' -print0 | xargs -0 shellcheck --severity=error
