name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Run tests
        run: bash tests/run.sh

  # v2.9.3: verify the cross-platform hardening (G1 notify, G2 md5, G3 flock)
  # actually works on real Windows Git Bash — GitHub's `shell: bash` on
  # windows-latest IS Git Bash (bundled MSYS2), the runtime Claude Code routes to.
  # Scoped to the Phase 1 fallback suites (they need no Claude Code session); the
  # .gitattributes LF rule (G5) is exercised implicitly — a CRLF .sh wouldn't run.
  test-windows:
    name: Test suite (Windows / Git Bash)
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Verify prerequisites on PATH
        run: |
          command -v jq >/dev/null 2>&1 || choco install jq -y
          echo "bash:    $(bash --version | head -1)"
          echo "jq:      $(jq --version)"
          echo "python3: $(python3 --version 2>&1 || python --version)"

      # TEMPORARY probe: observe what native Windows Python actually sees for HOME /
      # expanduser / a POSIX path, so the path-class fix isn't a guess. Decides
      # whether `os.environ.get('HOME')` is MSYS-converted (openable) or raw POSIX.
      - name: PROBE native Windows Python path behavior (temporary)
        shell: bash --noprofile --norc {0}
        run: |
          set +e
          T=$(mktemp -d); echo "hello" > "$T/marker.txt"; export HOME="$T"
          echo "HOME(bash)=$HOME"; echo "cygpath-w=$(cygpath -w "$T" 2>/dev/null)"
          python3 - <<'PY'
          import os
          print("HOME(py)   =", repr(os.environ.get('HOME')))
          print("expanduser =", repr(os.path.expanduser('~')))
          print("USERPROFILE=", repr(os.environ.get('USERPROFILE')))
          h = os.environ.get('HOME','')
          p = os.path.join(h, 'marker.txt')
          try: print("open via HOME:", "OK", open(p).read().strip())
          except Exception as e: print("open via HOME:", "FAIL", type(e).__name__, e)
          PY
          WIN=$(cygpath -w "$T")
          WIN="$WIN" python3 -c "import os; p=os.path.join(os.environ['WIN'],'marker.txt'); print('open via cygpath:', ('OK '+open(p).read().strip()) if os.path.isfile(p) else 'MISSING')"

      # TEMPORARY diagnostic: run the ENTIRE suite on Git Bash to surface every
      # Windows-only failure at once (per-file timeout so a hang can't block the
      # sweep; never fails the step so we see the full list). Triage → fix real
      # hook bugs / guard test-harness-only issues → then remove this step.
      - name: FULL SUITE sweep (temporary — enumerate all Windows failures)
        shell: bash --noprofile --norc {0}   # NO -e/-o pipefail, so the sweep never dies mid-loop
        run: |
          set +e
          fails=""
          for t in tests/test-*.sh; do
            timeout 90 bash "$t" >/tmp/o 2>&1
            ec=$?
            if [ "$ec" -ne 0 ]; then
              echo "##### FAIL/TIMEOUT (exit $ec): ${t##*/} #####"
              grep -aiE "FAIL|Error|error:|not found|No such|Traceback|command not found" /tmp/o 2>/dev/null | head -12
              fails="$fails ${t##*/}(${ec})"
            fi
          done
          echo "=================================================="
          echo "FAILING FILES:${fails:- NONE}"
          echo "=================================================="
          exit 0

      # Split per-suite with a hard timeout so a hang fails fast and the step
      # view pinpoints the culprit (rather than one opaque multi-suite step).
      - name: notify-helper (G1 Windows toast branch)
        run: timeout 180 bash tests/test-notify-helper.sh

      - name: md5 fallback (G2 python tier)
        run: timeout 180 bash tests/test-md5-fallback.sh

      - name: tool-history-tracker (G3 flock-absent trim)
        run: timeout 180 bash tests/test-tool-history-tracker.sh

      # Regression + functional proof for all 7 python-CRLF fixes on real Git Bash.
      - name: windows-crlf hardening (7 hooks)
        run: timeout 180 bash tests/test-windows-crlf.sh

  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check version strings match
        run: |
          LIB=$(grep -m1 '^VERSION=' lib/utils.sh | tr -d '"' | cut -d= -f2)
          TOOL=$(grep -m1 '^VERSION=' tools/supercharger.sh | tr -d '"' | cut -d= -f2)
          README=$(grep -oE 'version-[0-9]+\.[0-9]+\.[0-9]+' README.md | head -1 | sed 's/^version-//')
          echo "lib/utils.sh:          $LIB"
          echo "tools/supercharger.sh: $TOOL"
          echo "README.md:             $README"
          if [ "$LIB" != "$TOOL" ] || [ "$LIB" != "$README" ]; then
            echo "ERROR: Version mismatch — all three must match."
            exit 1
          fi
          echo "OK: all versions are $LIB"

  shellcheck:
    name: Shellcheck
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck
        run: |
          if command -v apt-get &>/dev/null; then
            sudo apt-get install -y shellcheck
          elif command -v brew &>/dev/null; then
            brew install shellcheck
          fi

      - name: Check hooks, lib, tools, and tests for errors
        run: |
          find hooks/ lib/ tools/ tests/ -name '*.sh' -print0 | xargs -0 shellcheck --severity=error
